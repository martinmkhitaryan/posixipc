target-version = "py312"
line-length = 120
src = ["src"]
extend-exclude = [
    "build-dev",
    "build-asan",
    "build-ubsan",
    "build-tsan",
]

[lint]
select = ["E4", "E7", "E9", "E501", "F", "I", "B"]
ignore = ["E731"]

[lint.isort]
known-first-party = ["posixipc"]

[format]
quote-style = "preserve"
